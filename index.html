<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SETBACKS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>

    <style>
        /* =========================================
           1. IMPOSTAZIONI GENERALI DELLA PAGINA
           ========================================= */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Playfair Display', serif;
            overflow: hidden; 
            position: relative; /* Serve per ancorare lo sfondo sfocato */
        }

        /* =========================================
           2. LO SFONDO SFOCATO (Livello Fantasma)
           ========================================= */
        body::before {
            content: "";
            position: absolute;
            /* Allarghiamo leggermente oltre i bordi (-5%) per evitare che la sfocatura crei un alone bianco ai lati dello schermo */
            top: -5%; left: -5%; 
            width: 110%; height: 110%;
            
            /* INSERISCI QUI LA TUA IMMAGINE */
            background-image: url('sfondo_setback.png'); 
            
            background-size: cover;
            background-position: center;
            
            /* LA MAGIA DELLA SFOCATURA */
            filter: blur(15px); /* Puoi aumentare (es. 20px) o diminuire questo valore */
            
            z-index: -1; /* Lo spinge dietro a tutto il resto */
        }

        /* =========================================
           3. IL CONTENITORE IN VETRO
           ========================================= */
        .glass-container {
            width: 90%; 
            max-width: 900px; 
            height: 85vh; 
            
            /* Vetro leggermente più opaco (0.6) per leggere bene il testo */
            background: rgba(255, 255, 255, 0.6); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 15px; 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            
            padding: 40px;
            overflow-y: auto; 
            
            opacity: 0;
            animation: fadeIn 1s forwards 0.5s;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .glass-container::-webkit-scrollbar { width: 8px; }
        .glass-container::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.3); border-radius: 10px; }
        .glass-container::-webkit-scrollbar-track { background: transparent; }

        /* =========================================
           4. AREA PDF (IL MIMETISMO)
           ========================================= */
        #pdf-render-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0; /* Unisce le pagine */
        }

        .pdf-page-canvas {
            width: 100%; 
            height: auto;
            display: block;
            margin: 0; 
            
            /* LA MAGIA CHE ELIMINA IL BIANCO */
            /* Multiply letteralmente "moltiplica" i colori: 
               il bianco scompare del tutto, il nero resta intatto! */
            mix-blend-mode: multiply; 
            
            /* Fondamentale per alcuni browser (come Safari) */
            -webkit-mix-blend-mode: multiply;
            
            /* Nessun altro filtro qui, altrimenti il trucco si rompe! */
        }

        #loading-msg {
            text-align: center;
            font-size: 20px;
            color: #333;
            margin-top: 50px;
            font-style: italic;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <div id="loading-msg">Lettura del documento in corso...</div>
        <div id="pdf-render-container"></div>
    </div>

    <script>
        // =========================================
        // 🔹 INSERISCI QUI IL NOME DEL TUO FILE PDF
        // =========================================
        const myPdfUrl = 'Setbacks.pdf';

        const container = document.getElementById('pdf-render-container');
        const loadingMsg = document.getElementById('loading-msg');

        async function loadAndRenderPDF() {
            try {
                const loadingTask = pdfjsLib.getDocument(myPdfUrl);
                const pdf = await loadingTask.promise;
                loadingMsg.style.display = 'none';
                
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 2.0 });
                    
                    const canvas = document.createElement('canvas');
                    canvas.className = 'pdf-page-canvas';
                    const context = canvas.getContext('2d');
                    
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    container.appendChild(canvas);
                    
                    const renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };
                    await page.render(renderContext).promise;
                }
            } catch (error) {
                loadingMsg.innerHTML = "Errore: Impossibile caricare il file PDF.<br>Controlla che il nome (myPdfUrl) sia corretto.";
                loadingMsg.style.color = "red";
                console.error(error);
            }
        }

        loadAndRenderPDF();
    </script>
</body>
</html>
