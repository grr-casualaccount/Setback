<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SETBACKS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>

    <style>
        /* =========================================
           1. IMPOSTAZIONI GENERALI DELLA PAGINA
           ========================================= */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Playfair Display', serif;
            overflow: hidden; 
            position: relative; 
        }

        /* =========================================
           2. LO SFONDO SFOCATO (Livello Fantasma)
           ========================================= */
        body::before {
            content: "";
            position: absolute;
            top: -5%; left: -5%; 
            width: 110%; height: 110%;
            
            /* INSERISCI QUI LA TUA IMMAGINE */
            background-image: url('sfondo_setback.jpg'); 
            
            background-size: cover;
            background-position: center;
            
            filter: blur(15px); /* Sfocatura */
            z-index: -1; 
        }

        /* =========================================
           3. IL CONTENITORE IN VETRO
           ========================================= */
        .glass-container {
            width: 90%; 
            max-width: 900px; 
            height: 85vh; 
            
            /* Il vetro: semi-trasparente */
            background: rgba(255, 255, 255, 0.5); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 15px; 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            
            padding: 40px;
            overflow-y: auto; 
            
            opacity: 0;
            animation: fadeIn 1s forwards 0.5s;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .glass-container::-webkit-scrollbar { width: 8px; }
        .glass-container::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.3); border-radius: 10px; }
        .glass-container::-webkit-scrollbar-track { background: transparent; }

        /* =========================================
           4. AREA PDF (Niente più CSS per il bianco!)
           ========================================= */
        #pdf-render-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0; 
        }

        .pdf-page-canvas {
            width: 100%; 
            height: auto;
            display: block;
            margin: 0; 
            
            /* Nessun filtro CSS qui, altrimenti il browser va in palla! 
               Fa tutto il Javascript più in basso. */
        }

        #loading-msg {
            text-align: center;
            font-size: 20px;
            color: #333;
            margin-top: 50px;
            font-style: italic;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <div id="loading-msg">Estrazione dell'inchiostro in corso...</div>
        <div id="pdf-render-container"></div>
    </div>

    <script>
        // =========================================
        // 🔹 INSERISCI QUI IL NOME DEL TUO FILE PDF
        // =========================================
        const myPdfUrl = 'Setbacks.pdf';

        const container = document.getElementById('pdf-render-container');
        const loadingMsg = document.getElementById('loading-msg');

        async function loadAndRenderPDF() {
            try {
                const loadingTask = pdfjsLib.getDocument(myPdfUrl);
                const pdf = await loadingTask.promise;
                loadingMsg.style.display = 'none';
                
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    
                    // Scala l'immagine (1.5 offre testo nitido e caricamento veloce)
                    const viewport = page.getViewport({ scale: 1.5 });
                    
                    const canvas = document.createElement('canvas');
                    canvas.className = 'pdf-page-canvas';
                    const context = canvas.getContext('2d');
                    
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    container.appendChild(canvas);
                    
                    const renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };
                    
                    // Disegna la pagina PDF in memoria
                    await page.render(renderContext).promise;

                    // ========================================================
                    // 🪄 MAGIA JAVASCRIPT: DISTRUZIONE DEL FOGLIO BIANCO
                    // ========================================================
                    
                    // Estraiamo tutti i pixel del foglio appena disegnato
                    const imgData = context.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imgData.data;
                    
                    // Scansioniamo pixel per pixel...
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i];
                        const g = data[i+1];
                        const b = data[i+2];
                        
                        // Calcoliamo quanto è "chiaro" il pixel (Luminosità)
                        const luminosita = 0.299 * r + 0.587 * g + 0.114 * b;
                        
                        // Coloriamo il pixel con un verde-nero molto scuro (Stile San Mungo)
                        data[i] = 15;     // Rosso
                        data[i+1] = 25;   // Verde 
                        data[i+2] = 20;   // Blu
                        
                        // Il trucco: L'Alpha (trasparenza) diventa l'inverso della luminosità.
                        // I pixel neri (il testo) restano solidi, i pixel bianchi (il foglio) spariscono nel nulla!
                        data[i+3] = 255 - luminosita; 
                    }
                    
                    // Riapplichiamo l'inchiostro epurato dalla carta
                    context.putImageData(imgData, 0, 0);
                    // ========================================================
                }
            } catch (error) {
                loadingMsg.innerHTML = "Errore: Impossibile caricare il file PDF.<br>Controlla che il nome sia corretto.";
                loadingMsg.style.color = "red";
                console.error(error);
            }
        }

        loadAndRenderPDF();
    </script>
</body>
</html>
